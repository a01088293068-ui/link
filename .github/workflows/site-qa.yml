name: LinkWiki SEO build QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'directory.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/verified-directory.json'
      - 'assets/directory.js'
      - 'assets/directory-search.js'
      - 'assets/site-comparison.js'
      - 'assets/address-inspector.js'
      - 'assets/style.css'
      - 'assets/blog.css'
      - 'assets/site.js'
      - 'about.html'
      - 'privacy.html'
      - 'build.py'
      - 'seo/site_audit.py'
      - 'seo/significant-page-updates.json'
      - 'seo/internal-link-report.py'
      - 'seo/live_release_check.py'
      - 'seo/live_crawl_smoke.py'
      - 'seo/check_directory_links.py'
      - 'seo/rank_tracker.py'
      - 'seo/search_console_monitor.py'
      - 'seo/index_priority_plan.py'
      - 'seo/directory_maintenance.py'
      - 'seo/recover_stalled_sitemap.py'
      - 'seo/auto_seo.py'
      - 'seo/backlink_discovery.py'
      - 'guides/**'
      - 'categories/**'
      - 'content/**'
      - 'tests/**'
      - '.github/workflows/site-qa.yml'
      - '.github/workflows/live-crawl-check.yml'
      - '.github/workflows/search-console-monitor.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'directory.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/verified-directory.json'
      - 'assets/directory.js'
      - 'assets/directory-search.js'
      - 'assets/site-comparison.js'
      - 'assets/address-inspector.js'
      - 'assets/style.css'
      - 'assets/blog.css'
      - 'assets/site.js'
      - 'about.html'
      - 'privacy.html'
      - 'build.py'
      - 'seo/site_audit.py'
      - 'seo/significant-page-updates.json'
      - 'seo/internal-link-report.py'
      - 'seo/live_release_check.py'
      - 'seo/live_crawl_smoke.py'
      - 'seo/check_directory_links.py'
      - 'seo/rank_tracker.py'
      - 'seo/search_console_monitor.py'
      - 'seo/recover_stalled_sitemap.py'
      - 'seo/auto_seo.py'
      - 'seo/backlink_discovery.py'
      - 'guides/**'
      - 'categories/**'
      - 'content/**'
      - 'tests/**'
      - '.github/workflows/site-qa.yml'
      - '.github/workflows/live-crawl-check.yml'
      - '.github/workflows/search-console-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check directory JSON, JS and static HTML consistency
        run: python3 -B -m unittest discover -s tests -p 'test_published_directory_consistency.py' -v
      - name: Build Cloudflare Pages release
        run: python3 -B build.py
      - name: Check homepage core keyword and count regression
        run: python3 -B -m unittest discover -s tests -p 'test_home_intent.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test directory search and comparison actions
        run: node --test tests/test_directory_search.cjs tests/test_directory_dom.cjs tests/test_comparison_card_actions.cjs
      - name: Test local address hostname inspector
        run: node --test tests/test_address_inspector.cjs
      - name: Verify generated sitemap and canonical URLs
        run: python3 -B -m seo.site_audit dist
      - name: Report crawlable inbound links to priority landing pages
        run: python3 seo/internal-link-report.py
      - name: Upload internal SEO link-graph audit
        uses: actions/upload-artifact@v4
        with:
          name: linkwiki-internal-link-report
          path: seo/internal-link-report.md
          retention-days: 30
      - name: Test build and content QA regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_site_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_live_release_check.py' -v
          python3 -m unittest discover -s tests -p 'test_live_crawl_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_directory_reachability.py' -v
          python3 -m unittest discover -s tests -p 'test_directory_link_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_seo_release_regression.py' -v
          python3 -m unittest discover -s tests -p 'test_auto_seo.py' -v
          python3 -m unittest discover -s tests -p 'test_rank_tracker.py' -v
          python3 -m unittest discover -s tests -p 'test_search_console_monitor.py' -v
          python3 -m unittest discover -s tests -p 'test_index_priority_plan.py' -v
          python3 -m unittest discover -s tests -p 'test_directory_maintenance.py' -v
          python3 -m unittest discover -s tests -p 'test_verified_destination_redirects.py' -v
          python3 -m unittest discover -s tests -p 'test_recover_stalled_sitemap.py' -v
          python3 -m unittest discover -s tests -p 'test_backlink_discovery.py' -v
