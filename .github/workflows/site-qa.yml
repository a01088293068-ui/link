name: LinkWiki SEO build QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'directory.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/verified-directory.json'
      - 'assets/directory.js'
      - 'assets/directory-search.js'
      - 'about.html'
      - 'privacy.html'
      - 'build.py'
      - 'seo/site_audit.py'
      - 'seo/live_release_check.py'
      - 'seo/live_crawl_smoke.py'
      - 'seo/check_directory_links.py'
      - 'seo/rank_tracker.py'
      - 'seo/search_console_monitor.py'
      - 'seo/recover_stalled_sitemap.py'
      - 'seo/auto_seo.py'
      - 'seo/backlink_discovery.py'
      - 'guides/**'
      - 'categories/**'
      - 'content/**'
      - 'tests/**'
      - '.github/workflows/site-qa.yml'
      - '.github/workflows/live-crawl-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'directory.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/verified-directory.json'
      - 'assets/directory.js'
      - 'assets/directory-search.js'
      - 'about.html'
      - 'privacy.html'
      - 'build.py'
      - 'seo/site_audit.py'
      - 'seo/live_release_check.py'
      - 'seo/live_crawl_smoke.py'
      - 'seo/check_directory_links.py'
      - 'seo/rank_tracker.py'
      - 'seo/search_console_monitor.py'
      - 'seo/recover_stalled_sitemap.py'
      - 'seo/auto_seo.py'
      - 'seo/backlink_discovery.py'
      - 'guides/**'
      - 'categories/**'
      - 'content/**'
      - 'tests/**'
      - '.github/workflows/site-qa.yml'
      - '.github/workflows/live-crawl-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Cloudflare Pages release
        run: python3 build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser directory multi-term search
        run: node --test tests/test_directory_search.cjs
      - name: Verify generated sitemap and canonical URLs
        run: python3 seo/site_audit.py dist
      - name: Test build and content QA regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_site_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_live_release_check.py' -v
          python3 -m unittest discover -s tests -p 'test_live_crawl_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_directory_reachability.py' -v
          python3 -m unittest discover -s tests -p 'test_directory_link_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_seo_release_regression.py' -v
          python3 -m unittest discover -s tests -p 'test_auto_seo.py' -v
          python3 -m unittest discover -s tests -p 'test_rank_tracker.py' -v
          python3 -m unittest discover -s tests -p 'test_search_console_monitor.py' -v
          python3 -m unittest discover -s tests -p 'test_recover_stalled_sitemap.py' -v
          python3 -m unittest discover -s tests -p 'test_backlink_discovery.py' -v
