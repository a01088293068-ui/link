name: LinkWiki SEO research and publish

on:
  schedule:
    - cron: '15 2 * * 1,3,5'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only if review and quality gates pass'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: linkwiki-seo-content
  cancel-in-progress: false

jobs:
  article:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_SEO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search, generate and review one article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SEO_AI_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
          OPENAI_MODEL: gpt-4o
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$MANUAL_PUBLISH" == "true" ]]; then
            python3 seo/auto_seo.py --publish
          else
            python3 seo/auto_seo.py
          fi
      - name: Commit qualified article
        if: github.event_name == 'schedule' || inputs.publish == true
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/ seo/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add quality-reviewed LinkWiki information article'
            git push origin HEAD:main
          else
            echo 'No article passed review; nothing committed.'
          fi
      - name: Upload reviewed draft
        if: github.event_name == 'workflow_dispatch' && inputs.publish != true
        uses: actions/upload-artifact@v4
        with:
          name: seo-reviewed-draft
          path: seo/drafts/*.md
          if-no-files-found: ignore
