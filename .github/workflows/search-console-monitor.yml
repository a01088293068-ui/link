name: LinkWiki Search Console monitoring

on:
  workflow_dispatch:
  # Re-run URL Inspection when the GSC diagnostics or their workflow change.
  # Keep this path-scoped to avoid repeated private API calls on all SEO commits.
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-console-monitor.yml'
      - 'seo/search_console_monitor.py'
      - 'tests/test_search_console_monitor.py'
  schedule:
    - cron: '25 3 * * *'
  # Reinspect Google's indexed copy after the *live* deployment is verified.
  # A green build alone does not establish that Cloudflare has published.
  workflow_run:
    workflows: ['LinkWiki public crawlability smoke check']
    types: [completed]
    branches: [main]

# Multiple deployments can complete close together. Cancel obsolete inspections
# so Google's API is queried for the latest release instead of the same
# dated Search Console snapshot several times in parallel.
# Deployment bursts may cancel redundant deployment-driven scans, but must
# never cancel the independent daily Search Console snapshot.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'linkwiki-gsc-after-deploy' || 'linkwiki-gsc-independent' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  contents: read

jobs:
  performance:
    if: >-
      ${{ (github.event_name != 'workflow_run' ||
           github.event.workflow_run.conclusion == 'success') &&
          (vars.GSC_MONITOR_ENABLED == 'true' ||
           github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google authentication
        run: python3 -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Describe the verified release being inspected
        if: github.event_name == 'workflow_run'
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Inspecting Google indexed-copy after successful public release check"
          echo "Verified deployment source commit: ${VERIFIED_SHA}"
          echo "Public verification: ${VERIFIED_RUN}"
      - name: Test Search Console report formatting
        run: python3 -B -m unittest discover -s tests -p 'test_search_console_monitor.py' -v
      - name: Fetch private performance report
        id: gsc_fetch
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seo
          echo 'status: started' > seo/search-console-run-status.txt
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'status: missing_google_service_account_secret' > seo/search-console-run-status.txt
            echo 'GOOGLE_SERVICE_ACCOUNT_JSON secret is missing.'
            exit 1
          fi
          if [ -z "$GSC_PROPERTY" ]; then
            export GSC_PROPERTY='sc-domain:linkwiki.info'
          fi
          if python3 seo/search_console_monitor.py; then
            echo 'status: completed' > seo/search-console-run-status.txt
          else
            echo 'status: google_api_or_report_error' > seo/search-console-run-status.txt
            exit 1
          fi
      - name: Produce dated indexation and exact-keyword priority actions
        if: steps.gsc_fetch.outcome == 'success'
        run: python3 -B seo/index_priority_plan.py
      - name: Test priority decisions (offline)
        run: python3 -B -m unittest discover -s tests -p 'test_index_priority_plan.py' -v
      - name: Retain Search Console report or failure status for 30 days
        if: always() && steps.gsc_fetch.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: search-console-performance
          path: |
            seo/search-console-report.md
            seo/search-console-snapshot.json
            seo/index-priority-plan.md
            seo/search-console-run-status.txt
          if-no-files-found: warn
          retention-days: 30
