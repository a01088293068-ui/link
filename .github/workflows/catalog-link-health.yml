name: LinkWiki catalog link observations

on:
  workflow_dispatch:
  schedule:
    - cron: '10 5 * * *'
  push:
    branches: [main]
    paths:
      - 'seo/link_health_batch.py'
      - 'tests/test_link_health_batch.py'
      - '.github/workflows/catalog-link-health.yml'

permissions:
  contents: write

concurrency:
  group: linkwiki-catalog-link-observations
  cancel-in-progress: false

jobs:
  link-health:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify safe bounded HTTP observations (offline)
        run: python3 -B -m unittest discover -s tests -p 'test_link_health_batch.py' -v
      - name: Inspect one bounded batch of public catalogue domains
        run: python3 -B seo/link_health_batch.py --limit 36
      - name: Commit public observation snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/link-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish bounded directory HTTP observations'
            bash seo/push_with_rebase.sh
          fi
      - name: Retain report for manual catalog review
        uses: actions/upload-artifact@v4
        with:
          name: catalog-link-health
          path: seo/link-health-report.md
          if-no-files-found: warn
          retention-days: 30
