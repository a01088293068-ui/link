name: LinkWiki external listing health

on:
  workflow_dispatch:
  push:
    paths:
      - 'seo/external_link_health.py'
      - 'tests/test_external_link_health.py'
      - '.github/workflows/external-link-health.yml'
  schedule:
    - cron: '15 4 * * 1'

permissions:
  contents: read

concurrency:
  group: linkwiki-readonly-destination-audit
  cancel-in-progress: true

jobs:
  external-link-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests for URL and HTTP status semantics
        run: python3 -B -m unittest discover -s tests -p 'test_external_link_health.py' -v
      - name: Check actual directory destinations without changing content
        run: python3 seo/external_link_health.py --workers 6
      - name: Preserve report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkwiki-external-listing-health
          path: seo/external-link-health-report.md
          if-no-files-found: warn
          retention-days: 30
