name: LinkWiki sitemap HTTP diagnosis

on:
  workflow_dispatch:
  push:
    paths:
      - 'seo/sitemap_http_diagnostic.py'
      - 'tests/test_sitemap_http_diagnostic.py'
      - '.github/workflows/sitemap-http-diagnostic.yml'
      - 'robots.txt'
      - 'build.py'
  schedule:
    - cron: '40 5 * * 2,5'

permissions:
  contents: read

jobs:
  public-sitemap-http:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test XML and robots diagnostics offline
        run: python3 -B -m unittest discover -s tests -p 'test_sitemap_http_diagnostic.py' -v
      - name: Check public sitemap HTTP responses
        run: python3 seo/sitemap_http_diagnostic.py
      - name: Preserve evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-http-diagnostic
          path: seo/sitemap-http-report.md
          if-no-files-found: warn
          retention-days: 60
