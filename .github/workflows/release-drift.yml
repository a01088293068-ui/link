name: LinkWiki live release drift audit

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'assets/directory-search.js'
      - 'tests/test_directory_search.cjs'
      - 'seo/check_release_drift.py'
      - 'tests/test_release_drift.py'
      - 'tests/test_related_guides.py'
      - '.github/workflows/release-drift.yml'
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify audit rules with offline fixtures
        run: python3 -m unittest -v tests/test_release_drift.py tests/test_related_guides.py
      - name: Verify actual directory search behaviors
        run: node --test tests/test_directory_search.cjs
      - name: Build canonical deployment output
        run: python3 build.py
      - name: Compare live release with generated deployment output
        shell: bash
        run: |
          set -o pipefail
          python3 seo/check_release_drift.py | tee release-drift-report.txt
      - name: Save release report on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkwiki-release-drift-report
          path: release-drift-report.txt
          if-no-files-found: warn
