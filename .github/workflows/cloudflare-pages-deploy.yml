name: LinkWiki Cloudflare Pages production deployment

on:
  workflow_run:
    workflows: ['LinkWiki SEO build and consistency gate']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkwiki-cloudflare-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push')) &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare deployment configuration without exposing secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required GitHub secret/variable: ${key}"
              exit 1
            fi
          done
          if [[ ! "${CLOUDFLARE_PAGES_PROJECT}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Cloudflare project name must use lowercase letters, numbers and dashes"
            exit 1
          fi
      - name: Build exactly the checked-out release
        run: python3 -B build.py
      - name: Check release gate and all offline quality regressions
        run: |
          python3 -B seo/directory_release_gate.py
          python3 -B -m unittest discover -s tests -p 'test_*.py' -q
      - name: Verify exact Cloudflare Pages project, domain and production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: python3 -B seo/verify_cloudflare_project.py
      - name: Publish to explicitly configured Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          npx --yes wrangler@4 pages deploy dist             --project-name "${CLOUDFLARE_PAGES_PROJECT}"             --branch main             --commit-hash "${COMMIT_SHA}"
      - name: Verify live Pages output matches the deployed commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python3 -B seo/live_release_check.py --dist dist; then
              echo "PASS: Cloudflare public release matches $(git rev-parse HEAD)"
              exit 0
            fi
            if [[ "${attempt}" == "5" ]]; then
              echo "::error::Cloudflare deployment completed but live domain still differs"
              exit 1
            fi
            sleep 35
          done
