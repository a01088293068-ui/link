name: LinkWiki Naver IndexNow changed-page notification

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'index.html'
      - 'directory.html'
      - 'categories/**'
      - 'guides/**'
      - 'content/**'
      - 'assets/verified-directory.json'
      - 'assets/directory-evidence.json'
      - 'sitemap.xml'
      - 'seo/indexnow_notify.py'
      - 'tests/test_indexnow_notify.py'
      - '.github/workflows/indexnow-notify.yml'

permissions:
  contents: read

concurrency:
  group: linkwiki-indexnow-content
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test changed-page URL selection
        run: python3 -B -m unittest discover -s tests -p 'test_indexnow_notify.py' -v
      - name: Notify Naver of only changed canonical pages
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 -B seo/indexnow_notify.py --base "$BASE_SHA" --head "$HEAD_SHA"
