name: LinkWiki public backlink monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1'

permissions:
  contents: read

jobs:
  external-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public link check without network
        run: python3 -B -m unittest discover -s tests -p 'test_backlink_public_check.py' -v
      - name: Probe three public listing URLs (read-only)
        run: python3 seo/backlink-public-check.py
      - name: Upload dated evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-backlink-check
          path: seo/backlink-public-check-report.md
          if-no-files-found: warn
          retention-days: 60
