name: LinkWiki public crawlability smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: '40 1,13 * * *'
  workflow_run:
    workflows: ['LinkWiki SEO build and consistency gate']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  public-pages:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: linkwiki-live-deploy-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build expected SEO release
        run: python3 build.py
      - name: Record the exact source commit verified by this run
        shell: bash
        run: |
          echo "Expected release commit: $(git rev-parse HEAD)"
          echo "Trigger event: ${{ github.event_name }}"
      - name: Verify live SEO release matches current sources
        shell: bash
        run: |
          set -euo pipefail
          # Cloudflare Pages can deploy after GitHub build QA finishes.
          # Poll the same immutable expected commit up to five times, without
          # treating temporary stale releases as successful deployments.
          mkdir -p seo
          : > seo/live-release-diagnosis.log
          for attempt in 1 2 3 4 5; do
            echo "Release verification attempt ${attempt}/5" | tee -a seo/live-release-diagnosis.log
            if python3 seo/live_release_check.py --dist dist 2>&1 | tee -a seo/live-release-diagnosis.log; then
              echo "PASS: public release matches checked-out commit $(git rev-parse HEAD)"
              exit 0
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              echo "::error::Public deployment still differs after 5 attempts."
              exit 1
            fi
            echo "::warning::Public release may still be deploying (attempt ${attempt}/5). Retrying."
            sleep 50
          done
      - name: Preserve public release verification diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkwiki-live-release-diagnosis
          path: seo/live-release-diagnosis.log
          if-no-files-found: warn
          retention-days: 30
      - name: Check public SEO pages and crawl files
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://linkwiki.info'
          for path in / /directory /categories/ /blog/ /guides/directory-comparison /guides/directory-maintenance /robots.txt /sitemap.xml; do
            url="${BASE}${path}"
            echo "Checking ${url}"
            status=$(curl --location --silent --show-error --output /tmp/linkwiki-response --write-out '%{http_code}' --max-time 20 --retry 2 --retry-delay 2 "${url}")
            if [[ "${status}" != '200' ]]; then
              echo "::error::Unexpected HTTP ${status} at ${url}"
              exit 1
            fi
            if [[ "${path}" == '/robots.txt' ]]; then
              grep -Fq 'Sitemap: https://linkwiki.info/sitemap.xml' /tmp/linkwiki-response || { echo '::error::Sitemap missing in robots.txt'; exit 1; }
            fi
            if [[ "${path}" == '/sitemap.xml' ]]; then
              grep -Fq 'https://linkwiki.info/' /tmp/linkwiki-response || { echo '::error::Sitemap has no site URLs'; exit 1; }
              grep -Fq '<loc>https://linkwiki.info/guides/directory-maintenance</loc>' /tmp/linkwiki-response || { echo '::error::Maintenance transparency page missing from sitemap'; exit 1; }
            fi
            if [[ "${path}" == '/' || "${path}" == '/directory' || "${path}" == '/categories/' || "${path}" == '/blog/' || "${path}" == '/guides/directory-comparison' ]]; then
              grep -Eq '<html|<HTML' /tmp/linkwiki-response || { echo "::error::No HTML page at ${url}"; exit 1; }
              grep -Fq 'rel="canonical"' /tmp/linkwiki-response || { echo "::error::Canonical URL missing at ${url}"; exit 1; }
              expected_canonical="${BASE}${path}"
              if ! grep -Fq "href=\"${expected_canonical}\"" /tmp/linkwiki-response; then
                echo "::error::Canonical URL disagrees with public page: ${expected_canonical}"
                exit 1
              fi
              if grep -Eiq '<meta[^>]+name="robots"[^>]+noindex|<meta[^>]+content="[^"]*noindex[^"]*"[^>]+name="robots"' /tmp/linkwiki-response; then
                echo "::error::Noindex unexpectedly set at ${url}"
                exit 1
              fi
            fi
            echo "PASS ${url}"
          done
      - name: Verify latest published SEO article is crawlable and in sitemap
        shell: bash
        run: |
          set -euo pipefail
          latest=$(find content -maxdepth 1 -type f -name 'seo-*.md' -print | sort | tail -n 1)
          if [[ -z "${latest}" ]]; then
            echo "No published SEO article to inspect."
            exit 0
          fi
          slug=$(basename "${latest}" .md)
          url="https://linkwiki.info/blog/${slug}/"
          echo "Checking published article ${url}"
          status=$(curl --location --silent --show-error --output /tmp/linkwiki-post --write-out '%{http_code}' --max-time 20 --retry 2 --retry-delay 2 "${url}")
          if [[ "${status}" != '200' ]]; then
            echo "::error::Published SEO article returned HTTP ${status}: ${url}"
            exit 1
          fi
          grep -Fq "href=\"${url}\"" /tmp/linkwiki-post || { echo "::error::Published article has incorrect canonical: ${url}"; exit 1; }
          if grep -Eiq '<meta[^>]+name="robots"[^>]+noindex|<meta[^>]+content="[^"]*noindex[^"]*"[^>]+name="robots"' /tmp/linkwiki-post; then
            echo "::error::Published article has noindex: ${url}"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 'https://linkwiki.info/sitemap.xml' -o /tmp/linkwiki-sitemap
          grep -Fq "<loc>${url}</loc>" /tmp/linkwiki-sitemap || { echo "::error::Published article missing from sitemap: ${url}"; exit 1; }
          echo "PASS published SEO article ${url}"
      - name: Install Google authentication for optional stalled-sitemap recovery
        if: github.event_name == 'workflow_run'
        run: python3 -m pip install 'google-auth>=2,<3' 'requests>=2,<3'
      - name: Recover Google sitemap only if pending and never downloaded for 7+ days
        if: github.event_name == 'workflow_run'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
        run: python3 seo/recover_stalled_sitemap.py --dist dist
      - name: Check main-service outbound destination without blocking SEO checks
        if: always()
        shell: bash
        run: |
          status=$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 --retry 1 'https://linkwiki01.com/' || true)
          echo "LinkWiki main-service destination HTTP: ${status:-unreachable}"
          if [[ "${status}" != '200' ]]; then
            echo "::warning::Main-service destination linkwiki01.com is not responding with HTTP 200."
          fi
