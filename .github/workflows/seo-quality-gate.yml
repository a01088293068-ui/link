name: LinkWiki SEO build and consistency gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkwiki-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source directory consistency
        run: python3 -B -m unittest discover -s tests -p 'test_published_directory_consistency.py' -v
      - name: Build all published pages and run internal site audit
        run: python3 -B build.py
      - name: Generate verifiable release build manifest
        run: python3 -B seo/release_evidence.py --dist dist --commit "$(git rev-parse HEAD)" --output seo/release-build-evidence.json
      - name: Run all standard-library unit and regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Assess published Korean guide body overlap without auto-pruning
        run: python3 -B seo/content_overlap_review.py
      - name: Preserve editorial overlap review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkwiki-content-overlap-review
          path: |
            seo/content-overlap-review.md
            seo/content-overlap-observations.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve release build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkwiki-build-evidence
          path: seo/release-build-evidence.json
          if-no-files-found: warn
          retention-days: 30
